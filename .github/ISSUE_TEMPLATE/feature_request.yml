name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for malbox? We'd love to hear it. Please describe the problem you're trying to solve and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's missing or frustrating today?
      placeholder: When I try to ... I can't ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area of malbox does this relate to?
      options:
        - malbox (CLI)
        - malboxctl (daemon/CLI)
        - HTTP API
        - Scheduler
        - Database
        - Plugin System
        - Machinery / VM Management
        - Providers
        - Provisioners
        - Configuration
        - Frontend
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references that would help.
    validations:
      required: false
