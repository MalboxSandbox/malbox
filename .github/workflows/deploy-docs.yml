name: Deploy Rust Docs to GitHub Pages

on:
  push:
    branches: ["dev"]
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: devenv

    - name: Install devenv
      run: nix profile install nixpkgs#devenv

    - name: Generate documentation
      run: SQLX_OFFLINE=true devenv shell -- cargo doc --manifest-path back-end/Cargo.toml --no-deps --document-private-items

    - name: Add redirect to main crate
      run: echo '<meta http-equiv="refresh" content="0;url=malbox_daemon/index.html">' > back-end/target/doc/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: back-end/target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
