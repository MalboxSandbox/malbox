name: devenv - Rust CI

on:
  push:
    branches: ["push", "pull_request"]
  pull_request:
    branches: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
    - uses: cachix/cachix-action@v15
      with:
        name: devenv

    - name: Install devenv
      run: nix profile install nixpkgs#devenv

    - name: Run rustfmt
      run: cargo fmt --all -- --check

    # - name: Run linter
    # run: devenv shell -- cargo clippy --all-targets --all -- -D warnings

    - name: Build project
      run: SQLX_OFFLINE=true devenv shell -- cargo build --verbose

    - name: Tests
      run: SQLX_OFFLINE=true devenv shell -- cargo test
