name: Rust Docs - Deploy

on:
  push:
    branches: ["dev"]
    paths:
      - 'back-end/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SQLX_OFFLINE: "true"

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v14

    - name: Generate documentation
      run: nix develop .#backend --command cargo doc --manifest-path back-end/Cargo.toml --no-deps --document-private-items

    - name: Add redirect to main crate
      run: echo '<meta http-equiv="refresh" content="0;url=malbox_daemon/index.html">' > back-end/target/doc/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: back-end/target/doc

  deploy:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
