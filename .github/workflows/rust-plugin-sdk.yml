name: Rust Plugin SDK - Cross-Compile (Windows)

on:
  push:
    branches: ["main", "dev*"]
    paths:
      - 'back-end/crates/malbox-plugin-sdk/**'
      - 'back-end/crates/malbox-plugin-transport/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-plugin-sdk.yml'
  pull_request:
    branches: ["main", "dev*"]
    paths:
      - 'back-end/crates/malbox-plugin-sdk/**'
      - 'back-end/crates/malbox-plugin-transport/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/rust-plugin-sdk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      SQLX_OFFLINE: "true"

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v13

    - name: Cross-compile Rust SDK (x86_64-pc-windows-gnu)
      run: >
        nix develop .#backend --command
        cargo build --manifest-path back-end/Cargo.toml
        -p malbox-plugin-sdk
        --target x86_64-pc-windows-gnu
        --no-default-features --features guest
