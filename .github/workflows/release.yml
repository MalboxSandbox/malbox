name: Release - Build & Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SQLX_OFFLINE: "true"
  LINUX_TARGET: x86_64-unknown-linux-gnu
  WINDOWS_TARGET: x86_64-pc-windows-gnu

jobs:
  build-backend:
    name: Build backend binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: back-end

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v14

    - name: Build release binaries (Linux)
      run: >
        nix develop ..#backend --command
        cargo build --release --locked
        --manifest-path Cargo.toml
        -p malbox -p malboxctl

    - name: Package binaries
      run: |
        VERSION="${GITHUB_REF_NAME}"

        for bin in malbox malboxctl; do
          DIR="${bin}-${VERSION}-linux-x64"
          mkdir -p "${DIR}"
          cp "target/${LINUX_TARGET}/release/${bin}" "${DIR}/"
          tar czf "${DIR}.tar.gz" "${DIR}"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: backend-linux-x64
        path: |
          back-end/malbox-v*-linux-x64.tar.gz
          back-end/malboxctl-v*-linux-x64.tar.gz

  build-cpp-sdk-linux:
    name: Build C++ Plugin SDK (Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: back-end

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v14

    - name: Build C++ SDK distribution
      run: nix develop ..#backend --command cargo xtask dist-cpp-sdk --target linux

    - name: Package SDK
      run: |
        VERSION="${GITHUB_REF_NAME}"
        DIST="crates/malbox-plugin-sdk-cpp/dist-linux"
        mv "${DIST}" "malbox-plugin-sdk-cpp-${VERSION}-linux-x64"
        tar czf "malbox-plugin-sdk-cpp-${VERSION}-linux-x64.tar.gz" \
          "malbox-plugin-sdk-cpp-${VERSION}-linux-x64"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpp-sdk-linux-x64
        path: back-end/malbox-plugin-sdk-cpp-*-linux-x64.tar.gz

  build-cpp-sdk-windows:
    name: Build C++ Plugin SDK (Windows)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: back-end

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v14

    - name: Cross-compile C++ SDK distribution
      run: nix develop ..#backend --command cargo xtask dist-cpp-sdk --target windows

    - name: Package SDK
      run: |
        VERSION="${GITHUB_REF_NAME}"
        DIST="crates/malbox-plugin-sdk-cpp/dist-windows"
        mv "${DIST}" "malbox-plugin-sdk-cpp-${VERSION}-windows-x64"
        tar czf "malbox-plugin-sdk-cpp-${VERSION}-windows-x64.tar.gz" \
          "malbox-plugin-sdk-cpp-${VERSION}-windows-x64"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpp-sdk-windows-x64
        path: back-end/malbox-plugin-sdk-cpp-*-windows-x64.tar.gz

  build-frontend:
    name: Build front-end SPA
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: front-end

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: DeterminateSystems/magic-nix-cache-action@v14

    - name: Build SPA
      run: nix develop ..#frontend --command bash -c "pnpm install --frozen-lockfile && pnpm build"

    - name: Package SPA
      run: |
        VERSION="${GITHUB_REF_NAME}"
        tar czf "malbox-web-${VERSION}.tar.gz" -C build .

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-web
        path: front-end/malbox-web-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-backend, build-cpp-sdk-linux, build-cpp-sdk-windows, build-frontend]
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Generate changelog
      uses: orhun/git-cliff-action@v4
      id: changelog
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate checksums
      run: |
        cd artifacts
        for f in *.tar.gz; do
          sha256sum "$f" > "$f.sha256"
        done

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHANGELOG: ${{ steps.changelog.outputs.content }}
      run: |
        VERSION="${GITHUB_REF_NAME}"

        # Mark as prerelease only when the tag carries a pre-release suffix
        # (e.g. v0.2.0-alpha.1), so the flag agrees with the tag semantics
        # the installer's stable/nightly channels are based on.
        PRERELEASE_FLAG=""
        if [[ "${VERSION}" == *-* ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        gh release create "${VERSION}" \
          --title "${VERSION}" \
          ${PRERELEASE_FLAG} \
          --notes "${CHANGELOG}" \
          artifacts/*.tar.gz artifacts/*.sha256
