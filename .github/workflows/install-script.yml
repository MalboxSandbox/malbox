name: Install Script - Validate

on:
  push:
    branches: ["main", "dev*"]
    paths:
      - "back-end/scripts/install.ab"
      - "back-end/scripts/install.sh"
      - ".github/workflows/install-script.yml"
  pull_request:
    branches: ["main", "dev*"]
    paths:
      - "back-end/scripts/install.ab"
      - "back-end/scripts/install.sh"
      - ".github/workflows/install-script.yml"

jobs:
  build:
    name: Compile install script
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v6

    - name: Install Amber
      run: |
        curl -sSfL "https://github.com/amber-lang/amber/releases/latest/download/amber-linux-musl-x86_64.tar.xz" \
          | tar -xJ -C /usr/local/bin amber
        chmod +x /usr/local/bin/amber

    - name: Check syntax
      run: amber check back-end/scripts/install.ab

    - name: Compile to Bash
      run: amber build back-end/scripts/install.ab back-end/scripts/install.sh

    - name: Validate generated Bash
      run: bash -n back-end/scripts/install.sh

    - name: Check for uncommitted changes
      run: |
        # git status --porcelain catches a modified AND an untracked
        # install.sh; git diff alone ignores untracked files.
        if [ -n "$(git status --porcelain -- back-end/scripts/install.sh)" ]; then
          echo "::error::install.sh is out of date. Run 'amber build install.ab install.sh' and commit the result."
          git status --porcelain -- back-end/scripts/install.sh
          git diff -- back-end/scripts/install.sh
          exit 1
        fi
