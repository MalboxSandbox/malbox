[plugin]
name = "host-file-info"
version = "0.1.0"
description = "Computes SHA-256 hash and file size for submitted samples"
authors = ["Malbox Team"]
type = "host"
state = "ephemeral"
execution = "parallel"

[results.file_info]
description = "Basic file information (hash, size)"
user_visible = true
display_name = "File Info"
render = "json"

[events]
subscribe = ["TaskCreated"]
