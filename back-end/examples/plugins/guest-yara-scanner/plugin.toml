[plugin]
name = "guest-yara-scanner"
version = "0.1.0"
description = "Scans samples inside the guest VM using signature-based rules"
authors = ["Malbox Team"]
type = "guest"

[runtime]
state = "ephemeral"
execution = "parallel"

[results.report]
description = "Structured report envelope (verdict, IOCs, MITRE TTPs, matches)"
user_visible = true
display_name = "Report"
render = "report"

[results.yara_matches]
description = "Raw list of YARA rule matches with metadata"
user_visible = true
display_name = "YARA Matches"
render = "json"

[events]
subscribe = ["TaskCreated", "TaskStarting"]
