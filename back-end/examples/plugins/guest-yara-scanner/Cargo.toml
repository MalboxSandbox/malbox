[package]
name = "guest-yara-scanner"
version = "0.1.0"
edition = "2024"
description = "Example guest plugin that scans samples with YARA"
publish = false

[dependencies]
malbox-plugin-sdk = { path = "../../../crates/malbox-plugin-sdk", features = ["guest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yara-x = "1.7"
sha2 = "0.11"
hex = "0.4"
