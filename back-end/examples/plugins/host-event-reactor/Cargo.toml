[package]
name = "host-event-reactor"
version = "0.1.0"
edition = "2024"
description = "Example host plugin that reacts to system events"
authors = ["Malbox Team"]
publish = false

[dependencies]
malbox-plugin-sdk = { path = "../../../crates/malbox-plugin-sdk", features = ["host"] }
malbox-plugin-transport = { path = "../../../crates/malbox-plugin-transport" }
serde = { version = "1", features = ["derive"] }
