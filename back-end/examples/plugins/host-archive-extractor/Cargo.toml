[package]
name = "host-archive-extractor"
version = "0.1.0"
edition = "2024"
description = "Example host plugin that extracts zip archives as child artifacts"
authors = ["Malbox Team"]
publish = false

[dependencies]
malbox-plugin-sdk = { path = "../../../crates/malbox-plugin-sdk", features = ["host"] }
serde_json = "1"
zip = { version = "2.6", default-features = false, features = ["deflate", "aes-crypto"] }
