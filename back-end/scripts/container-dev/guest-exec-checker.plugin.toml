# Linux build of examples/plugins/guest-exec-checker for the container dev
# setup. Differs from the example's manifest only by dropping `port = 50052`
# and the Windows [runtime.paths]: the daemon waits on port 50051, and the
# unix path defaults (/tmp/malbox/*) match [guest_access.config].sample_dir.
[plugin]
name = "guest-exec-checker"
version = "0.1.0"
description = "Verifies that the submitted sample is executing on the guest OS"
authors = ["Malbox Team"]
type = "guest"

[runtime]
state = "ephemeral"
execution = "exclusive"
log_filter = "info"
analysis_timeout = 300

[runtime.stash]
threshold_bytes = 1048576
ttl_secs = 120

[results.report]
description = "Report envelope: whether the sample was running at the end of the analysis"
user_visible = true
display_name = "Report"
render = "report"

[results.exec_status]
description = "Sample execution status: whether the process was found running"
user_visible = true
display_name = "Execution Status"
render = "json"
