name = "windows-sandbox"
description = "Windows Sandbox for Malware Analysis"
platform = "windows"

[packer]
template = "base.pkr.hcl"

[packer.vars]
name = "win10-sandbox"
iso_url = "/path/to/windows10.iso"
iso_checksum = "sha256:YOUR_CHECKSUM_HERE"
virtio_iso_path = "/path/to/virtio-win.iso"
disk_size = "61440M"
cpus = 2
memory = 4096
headless = true
autounattend_path = "autounattend/Autounattend.xml"
tools_path = "C:\\Tools"

# WinRM credentials (must match Autounattend.xml)
winrm_username = "Administrator"
winrm_password = "packer"

[ansible]
playbook = "playbooks/windows.yml"

[ansible.vars]
sandbox_tools = "procmon,processhacker,wireshark,pestudio,x64dbg"
network_isolation = "true"
monitoring_server = "192.168.1.100"
