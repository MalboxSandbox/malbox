---
- name: Deploy Guest Plugins
  hosts: all
  gather_facts: yes

  vars:
    # Plugin binaries and startup scripts live here. Not configurable per
    # plugin because it's an install-time concern, not a runtime one.
    malbox_plugins_dir: C:\ProgramData\malbox\plugins
    # guest_plugins is injected by the ansible provisioner as an extra var.
    # Each entry has: {name, binary, toml, port, paths}
    # paths.sample_dir, paths.artifact_dir, paths.stash_dir, paths.log_dir
    # are resolved from the plugin's [runtime.paths] in plugin.toml.
    guest_plugins: []
    # Must match the user created in configure-autologin.yml.
    sandbox_username: John
    sandbox_password: malbox!sandbox42

  tasks:
    - name: Create plugin install directory
      win_file:
        path: "{{ malbox_plugins_dir }}\\{{ item.name }}"
        state: directory
      loop: "{{ guest_plugins }}"

    - name: Create plugin sample directory
      win_file:
        path: "{{ item.paths.sample_dir }}"
        state: directory
      loop: "{{ guest_plugins }}"
      when: item.paths is defined

    - name: Create plugin artifact directory
      win_file:
        path: "{{ item.paths.artifact_dir }}"
        state: directory
      loop: "{{ guest_plugins }}"
      when: item.paths is defined

    - name: Create plugin stash directory
      win_file:
        path: "{{ item.paths.stash_dir }}"
        state: directory
      loop: "{{ guest_plugins }}"
      when: item.paths is defined

    - name: Create plugin log directory
      win_file:
        path: "{{ item.paths.log_dir }}"
        state: directory
      loop: "{{ guest_plugins }}"
      when: item.paths is defined

    - name: Copy guest plugin binary
      win_copy:
        src: "{{ item.binary }}"
        dest: "{{ malbox_plugins_dir }}\\{{ item.name }}\\{{ item.name }}.exe"
      loop: "{{ guest_plugins }}"

    - name: Copy guest plugin manifest
      win_copy:
        src: "{{ item.toml }}"
        dest: "{{ malbox_plugins_dir }}\\{{ item.name }}\\plugin.toml"
      loop: "{{ guest_plugins }}"

    - name: Create guest plugin startup script
      # Runtime settings (port, log_filter, stash thresholds, etc.) are baked
      # into the plugin binary at compile time from its plugin.toml [runtime]
      # section. The startup script just launches the binary and redirects
      # stdout/stderr to the plugin's log_dir for post-mortem triage.
      win_copy:
        content: |
          @echo off
          "{{ malbox_plugins_dir }}\{{ item.name }}\{{ item.name }}.exe" >> "{{ item.paths.log_dir | default('C:\\ProgramData\\malbox\\logs') }}\{{ item.name }}.log" 2>&1
        dest: "{{ malbox_plugins_dir }}\\{{ item.name }}\\start.bat"
      loop: "{{ guest_plugins }}"

    - name: Grant sandbox user full control of plugin directories
      win_shell: |
        icacls "{{ malbox_plugins_dir }}" /grant "{{ sandbox_username }}:(OI)(CI)F" /T /Q
        icacls "{{ item.paths.sample_dir }}" /grant "{{ sandbox_username }}:(OI)(CI)F" /T /Q
        icacls "{{ item.paths.artifact_dir }}" /grant "{{ sandbox_username }}:(OI)(CI)F" /T /Q
        icacls "{{ item.paths.stash_dir }}" /grant "{{ sandbox_username }}:(OI)(CI)F" /T /Q
        icacls "{{ item.paths.log_dir }}" /grant "{{ sandbox_username }}:(OI)(CI)F" /T /Q
      loop: "{{ guest_plugins }}"
      when: item.paths is defined
      failed_when: false

    - name: Register guest plugin as scheduled task (interactive session)
      win_scheduled_task:
        name: "malbox-{{ item.name }}"
        description: "Malbox guest plugin: {{ item.name }}"
        actions:
          - path: "{{ malbox_plugins_dir }}\\{{ item.name }}\\start.bat"
            working_directory: "{{ malbox_plugins_dir }}\\{{ item.name }}"
        triggers:
          - type: logon
            user_id: "{{ sandbox_username }}"
        username: "{{ sandbox_username }}"
        password: "{{ sandbox_password }}"
        logon_type: interactive_token
        run_level: highest
        state: present
        enabled: yes
      loop: "{{ guest_plugins }}"

    - name: Start guest plugin now
      win_command: >
        schtasks /Run /TN "malbox-{{ item.name }}"
      loop: "{{ guest_plugins }}"

    - name: Allow inbound gRPC traffic for guest plugin
      win_firewall_rule:
        name: "Malbox Guest Plugin {{ item.name }} (TCP {{ item.port }})"
        localport: "{{ item.port }}"
        action: allow
        direction: in
        protocol: tcp
        enabled: yes
      loop: "{{ guest_plugins }}"
