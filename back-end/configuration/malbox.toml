# =============================================================================
# Malbox Configuration
# =============================================================================
#
# Copy this file to ~/.config/malbox/malbox.toml and adjust values as needed.
# Fields with defaults are commented out — uncomment to override.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
# All paths default to XDG directories (~/.config/malbox, ~/.cache/malbox, etc.)
# Uncomment to override.

[paths]
# config_dir = "/home/user/.config/malbox"
# cache_dir = "/home/user/.cache/malbox"
# data_dir = "/home/user/.local/share/malbox"
# state_dir = "/home/user/.local/state/malbox"

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

[general]
# Environment: "development", "staging", or "production"
environment = "development"
# Log level: "error", "warn", "info", "debug", or "trace" (default: "info")
# log_level = "info"
# Enable debug mode
# debug = false
# Maximum number of worker tasks (default: 4)
# max_workers = 4
# Minimum always-alive workers (default: 1)
# min_workers = 1
# Idle timeout for non-baseline workers, in milliseconds (default: 60000)
# idle_timeout_ms = 60000

# -----------------------------------------------------------------------------
# HTTP Server
# -----------------------------------------------------------------------------

[http]
host = "127.0.0.1"
port = 8080
# tls_enabled = false
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"
# CORS origins allowed to access the API
# cors_origins = ["http://localhost:5173"]
# Maximum upload size in bytes (default: 0 = unlimited)
# max_upload_size = 104857600

[database]
host = "postgresql://postgres@localhost:5432/malbox_db"
port = 5432

# Providers must be compiled into the daemon via Cargo features.
# Each enabled provider needs a corresponding [providers.<name>] section.

[providers]
enabled = ["libvirt"]
# default = "libvirt"

# Libvirt/KVM provider configuration
[providers.libvirt]
uri = "qemu:///system"
# storage_pool = "default"

[machinery]

# All fields are required (no defaults). Remove a machine from this list
# to destroy it on next daemon restart.

# [[machines]]
# name = "win10-analysis-1"
# image = "win10-base"
# platform = "windows"
# arch = "x64"
# cpus = 2
# memory = 4096          # MB
# disk_size = 65536      # MB
#
# [[machines]]
# name = "win10-analysis-2"
# image = "win10-base"
# platform = "windows"
# arch = "x64"
# cpus = 4
# memory = 8192          # MB
# disk_size = 65536      # MB
# # Optional: provider-specific overrides (libvirt example)
# [machines.provider_config]
# nic_model = "virtio"
# cpu_mode = "host-model"
#
# [[machines]]
# name = "ubuntu-analysis"
# image = "ubuntu-base"
# platform = "linux"
# arch = "x64"
# cpus = 2
# memory = 2048          # MB
# disk_size = 32768      # MB

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------
# Managed image store directory. When configured, the daemon watches this
# directory for image files and automatically registers them.

# [images]
# store_path = "/var/lib/malbox/images"

# -----------------------------------------------------------------------------
# Provisioning
# -----------------------------------------------------------------------------
# Global provisioning pipeline. Each step runs a provisioner against every
# machine after allocation. Steps with a `snapshot` key create a provider
# snapshot recorded in the database.

[[provisioning.steps]]
type = "native"
snapshot = "base"

# [[provisioning.steps]]
# type = "ansible"
# snapshot = "configured"
# [provisioning.steps.config]
# playbook = "playbooks/windows/windows.yml"

# [[provisioning.steps]]
# type = "ansible"
# snapshot = "with-guest-plugin"
# [provisioning.steps.config]
# playbook = "playbooks/windows/deploy-guest-plugin.yml"
# [provisioning.steps.config.extra_vars]
# guest_plugin_binary = "/path/to/plugin.exe"
# guest_plugin_toml = "/path/to/plugin.toml"

# -----------------------------------------------------------------------------
# Guest Access
# -----------------------------------------------------------------------------
# Configures how the daemon communicates with guest VMs for file transfer
# and command execution. The transport is resolved against the provider's
# native capabilities first, then standalone transports.
# When omitted, guest access is disabled and tasks requiring it will fail.

# [guest_access]
# transport = "virtio-serial"    # or "grpc", "qemu-guest-agent", etc.
# [guest_access.config]
# port = 9500

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

[plugins]
# directory = "/home/user/.config/malbox/plugins"
# watch = true

# -----------------------------------------------------------------------------
# Analysis
# -----------------------------------------------------------------------------

[analysis]
timeout = 300
max_vms = 5
default_profile = "default"

[analysis.windows]
default_profile = "win10_default"
# Per-platform overrides (optional)
# timeout = 300
# max_vms = 3

[analysis.linux]
default_profile = "ubuntu_default"
# timeout = 300
# max_vms = 2
