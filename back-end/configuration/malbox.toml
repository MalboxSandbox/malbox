# =============================================================================
# Malbox Configuration
# =============================================================================
#
# Copy this file to ~/.config/malbox/malbox.toml and adjust values as needed.
# Fields with defaults are commented out — uncomment to override.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
# All paths default to XDG directories (~/.config/malbox, ~/.cache/malbox, etc.)
# Uncomment to override.

[paths]
# config_dir = "/home/user/.config/malbox"
# cache_dir = "/home/user/.cache/malbox"
# data_dir = "/home/user/.local/share/malbox"
# state_dir = "/home/user/.local/state/malbox"

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

[general]
# Environment: "development", "staging", or "production"
environment = "development"
# Log level: "error", "warn", "info", "debug", or "trace" (default: "info")
# log_level = "info"
# Enable debug mode
# debug = false

# -----------------------------------------------------------------------------
# HTTP Server
# -----------------------------------------------------------------------------

[http]
host = "127.0.0.1"
port = 8080
# tls_enabled = false
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"
# CORS origins allowed to access the API
# cors_origins = ["http://localhost:5173"]
# Maximum upload size in bytes (default: 0 = unlimited)
# max_upload_size = 104857600

# The daemon uses the database "malbox", provisioned by 'malbox daemon install'
# (or manually: CREATE DATABASE "malbox").
[database]
host = "localhost"
port = 5432
# Role to connect as (default: PGUSER, then the OS user - same as psql).
user = "postgres"
# password = ""

# Providers must be compiled into the daemon via Cargo features.
# Each enabled provider needs a corresponding [providers.<name>] section.

[providers]
enabled = ["libvirt"]
# default = "libvirt"

# Libvirt/KVM provider configuration
[providers.libvirt]
uri = "qemu:///system"
# storage_pool = "default"

# Container provider (Docker/Podman, rootful). Linux machines only.
# Requires `provider-container` compiled in; images are `docker save` archives.
# [providers.container]
# socket = "unix:///var/run/docker.sock"   # Podman: unix:///run/podman/podman.sock
# network = "malbox"
# subnet = "172.30.0.0/24"
# internal = false                         # true = no egress
# runtime = "runsc"                        # optional default OCI runtime

[machinery]

# All fields are required (no defaults). Remove a machine from this list
# to destroy it on next daemon restart.

# [[machines]]
# name = "win10-analysis-1"
# image = "win10-base"
# platform = "windows"
# arch = "x64"
# cpus = 2
# memory = 4096          # MB
# disk_size = 65536      # MB
#
# [[machines]]
# name = "win10-analysis-2"
# image = "win10-base"
# platform = "windows"
# arch = "x64"
# cpus = 4
# memory = 8192          # MB
# disk_size = 65536      # MB
# # Optional: provider-specific overrides (libvirt example)
# [machines.provider_config]
# nic_model = "virtio"
# cpu_mode = "host-model"
#
# [[machines]]
# name = "ubuntu-analysis"
# image = "ubuntu-base"
# platform = "linux"
# arch = "x64"
# cpus = 2
# memory = 2048          # MB
# disk_size = 32768      # MB
#
# [[machines]]
# name = "alpine-container"
# image = "alpine-ctr"   # registered `docker save` archive
# platform = "linux"     # container provider supports Linux only
# arch = "x64"
# cpus = 1
# memory = 512           # MB
# disk_size = 1024       # MB (ignored by the container provider)
# # Optional: container provider overrides
# [machines.provider_config]
# runtime = "runsc"                # overrides [providers.container].runtime
# cap_add = ["SYS_PTRACE"]
# command = ["/bin/sh", "-c", "exec tail -f /dev/null"]   # replaces the autostart command

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------
# Managed image store directory. When configured, the daemon watches this
# directory for image files and automatically registers them.

# [images]
# store_path = "/var/lib/malbox/images"

# -----------------------------------------------------------------------------
# Guest Access
# -----------------------------------------------------------------------------
# Configures how the daemon communicates with guest VMs for file transfer
# and command execution. The transport is resolved against the provider's
# native capabilities first, then standalone transports.
# When omitted, guest access is disabled and tasks requiring it will fail.

# [guest_access]
# transport = "virtio-serial"    # or "grpc", "qemu-guest-agent", etc.
# [guest_access.config]
# port = 9500

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

[plugins]
# directory = "/home/user/.config/malbox/plugins"
# watch = true

# -----------------------------------------------------------------------------
# Orchestration
# -----------------------------------------------------------------------------
# Limits and policies for recursive analysis. Every key is optional; the
# values below are the defaults.

# [orchestration]
# max_depth = 6
# max_artifacts = 500                  # analysed artifacts per task
# max_artifacts_per_job = 1000         # artifacts (any kind) one job may emit
# max_detonations = 3
# max_total_bytes = 2147483648
# max_file_size = 104857600            # larger artifacts are kept but not analysed
# task_deadline_secs = 7200
# max_artifact_time_secs = 1800
# stall_check_secs = 600
# max_attempts = 3
# retry_backoff_secs = 10              # multiplied by the attempt number
# max_reruns = 2                       # monitored-key re-runs per job
# host_concurrency = 4                 # concurrently running host jobs
# max_running_jobs_per_task = 8
# max_concurrent_vm_boots = 2
# detonation_decision_window_secs = 60
# cache_ttl_secs = 604800
# empty_result_cache_ttl_secs = 86400

# [[orchestration.detonation_profiles]]
# name = "win10-default"
# accepts = "executable/windows/.*|installer/windows/msi|document/office/.*|document/pdf|code/(javascript|vbs|powershell|batch|hta)|shortcut/windows"
# platform = "windows"
# snapshot = "with-plugins"
# tags = []
# guest_plugins = []                   # empty = every guest plugin in the snapshot
# timeout_secs = 300
