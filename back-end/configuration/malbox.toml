# =============================================================================
# Malbox Configuration
# =============================================================================
#
# Copy this file to ~/.config/malbox/malbox.toml and adjust values as needed.
# Fields with defaults are commented out — uncomment to override.

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
# All paths default to XDG directories (~/.config/malbox, ~/.cache/malbox, etc.)
# Uncomment to override.

[paths]
# config_dir = "/home/user/.config/malbox"
# cache_dir = "/home/user/.cache/malbox"
# data_dir = "/home/user/.local/share/malbox"
# state_dir = "/home/user/.local/state/malbox"

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

[general]
# Environment: "development", "staging", or "production"
environment = "development"
# Log level: "error", "warn", "info", "debug", or "trace" (default: "info")
# log_level = "info"
# Enable debug mode
# debug = false
# Number of worker threads for task processing (default: 4)
# worker_threads = 4

# -----------------------------------------------------------------------------
# HTTP Server
# -----------------------------------------------------------------------------

[http]
host = "127.0.0.1"
port = 8080
# tls_enabled = false
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"
# CORS origins allowed to access the API
# cors_origins = ["http://localhost:5173"]
# Maximum upload size in bytes (default: 0 = unlimited)
# max_upload_size = 104857600

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------

[database]
host = "postgresql://postgres@localhost:5432/malbox_db"
port = 5432

# -----------------------------------------------------------------------------
# Providers
# -----------------------------------------------------------------------------
# Providers must be compiled into the daemon via Cargo features.
# Each enabled provider needs a corresponding [providers.<name>] section.

[providers]
enabled = ["libvirt"]
# default = "libvirt"

# Libvirt/KVM provider configuration
[providers.libvirt]
uri = "qemu:///system"
# storage_pool = "default"

# -----------------------------------------------------------------------------
# Machinery
# -----------------------------------------------------------------------------

[machinery]
# Manager type: "ondemand" or "pooled" (default: "ondemand")
# "ondemand" — allocates a new VM per task, works with any provider.
# "pooled"   — pre-allocates VMs and restores snapshots between tasks.
#              Requires the provider to support the Snapshot capability.
manager = "ondemand"

[machinery.defaults]
# Default resources for allocated machines
# cpus = 2
# memory = 2048
# video_memory = 128

# Name of the image (from the image registry) to use for new machines.
# The image must be registered via the API before it can be referenced here.
# image = "win10-base"

# Pool settings (only used when manager = "pooled")
[machinery.pool]
# min_size = 1
# max_size = 5
# clean_snapshot_name = "clean"

# -----------------------------------------------------------------------------
# Images (optional)
# -----------------------------------------------------------------------------
# Managed image store directory. When configured, the daemon watches this
# directory for qcow2 files and automatically updates image availability
# in the registry.

# [images]
# store_path = "/var/lib/malbox/images"

# -----------------------------------------------------------------------------
# Provisioning (optional)
# -----------------------------------------------------------------------------
# When configured, machines are provisioned after allocation.
# Uncomment to enable.

# [provisioning]
# type = "ansible"
# [provisioning.config]
# playbook = "playbooks/setup.yml"

# -----------------------------------------------------------------------------
# Guest Access (optional)
# -----------------------------------------------------------------------------
# Configures how the daemon communicates with guest VMs for file transfer
# and command execution. The transport is resolved against the provider's
# native capabilities first, then standalone transports.
# When omitted, guest access is disabled and tasks requiring it will fail.

# [guest_access]
# transport = "virtio-serial"    # or "grpc", "qemu-guest-agent", etc.
# [guest_access.config]
# Transport-specific configuration goes here.
# e.g., for grpc:
# port = 9500

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# Directory containing plugin subdirectories. Each subdirectory should contain
# a plugin.toml manifest and the plugin binary.

[plugins]
# directory = "/home/user/.config/malbox/plugins"
# watch = true

# -----------------------------------------------------------------------------
# Analysis
# -----------------------------------------------------------------------------

[analysis]
timeout = 300
max_vms = 5
default_profile = "default"

[analysis.windows]
default_profile = "win10_default"
# Per-platform overrides (optional)
# timeout = 300
# max_vms = 3

[analysis.linux]
default_profile = "ubuntu_default"
# timeout = 300
# max_vms = 2
