[package]
name = "malboxctl"
version = "0.1.0"
edition = "2024"

[features]
default = ["provider-libvirt", "provisioner-ansible"]
provider-libvirt = ["malbox-daemon/provider-libvirt"]
provider-xen = ["malbox-daemon/provider-xen"]
provisioner-ansible = ["malbox-daemon/provisioner-ansible"]

[dependencies]
malbox-cli-common = { path = "../../crates/malbox-cli-common" }
malbox-config = { path = "../../crates/malbox-config" }
malbox-installer = { path = "../../crates/malbox-installer" }
malbox-daemon = { path = "../../crates/malbox-daemon", default-features = false }
malbox-tracing = { path = "../../crates/malbox-tracing" }
tokio = { workspace = true }
tokio-util = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
console = "0.16.3"
dialoguer = { workspace = true }
