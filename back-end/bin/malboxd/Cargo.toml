[package]
name = "malboxd"
version = "0.1.0"
edition = "2024"

[features]
default = ["provider-libvirt", "provisioner-ansible"]
provider-libvirt = ["malbox-daemon/provider-libvirt"]
provisioner-ansible = ["malbox-daemon/provisioner-ansible"]

[dependencies]
malbox-config = { path = "../../crates/malbox-config" }
malbox-daemon = { path = "../../crates/malbox-daemon", default-features = false }
malbox-tracing = { path = "../../crates/malbox-tracing" }
tokio = { workspace = true }
tokio-util = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
malbox-installer = { path = "../../crates/malbox-installer" }
toml = { workspace = true }
