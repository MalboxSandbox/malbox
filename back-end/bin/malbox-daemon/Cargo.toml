[package]
name = "malbox-daemon"
version = "0.1.0"
edition = "2024"

[features]
default = ["provider-libvirt", "provisioner-ansible"]
provider-libvirt = ["dep:malbox-provider-libvirt"]
# Add more providers here as they're implemented:
# provider-vmware = ["dep:malbox-provider-vmware"]
# provider-virtualbox = ["dep:malbox-provider-virtualbox"]
provisioner-ansible = ["dep:malbox-provisioner-ansible"]

[dependencies]
malbox-database = { path = "../../crates/malbox-database" }
malbox-utils = { path = "../../crates/malbox-utils" }
malbox-tracing.path = "../../crates/malbox-tracing"
malbox-config = { path = "../../crates/malbox-config" }
malbox-scheduler = { path = "../../crates/malbox-scheduler" }
malbox-http = { path = "../../crates/malbox-http" }
malbox-machinery = { path = "../../crates/malbox-machinery" }
malbox-resources = { path = "../../crates/malbox-resources" }
malbox-plugin-internal = { path = "../../crates/malbox-plugin-internal" }

# Provider implementations (optional, feature-gated)
malbox-provider-libvirt = { path = "../../crates/malbox-provider-libvirt", optional = true }
# malbox-provider-vmware = { path = "../../crates/malbox-provider-vmware", optional = true }
# malbox-provider-virtualbox = { path = "../../crates/malbox-provider-virtualbox", optional = true }

# Provisioner implementations (optional, feature-gated)
malbox-provisioner-ansible = { path = "../../crates/malbox-provisioner-ansible", optional = true }

color-eyre = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { version = "4.5.26", features = ["derive"] }
