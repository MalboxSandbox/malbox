[package]
name = "malbox-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
malbox-config = { path = "../../crates/malbox-config" }
malbox-installer = { path = "../../crates/malbox-installer" }
malbox-tracing = { path = "../../crates/malbox-tracing" }
tokio = { workspace = true }
color-eyre = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
dialoguer = { workspace = true }
rattles = "0.3"
chrono.workspace = true
toml.workspace = true
clap = { version = "4.5.26", features = ["derive"] }
clap_complete = "4.5.42"
serde_yaml = "0.9.34"
serde_json = "1.0.137"
console = "0.16.2"
byte-unit = "5.1.6"
time.workspace = true
reqwest = { version = "0.12", features = ["json", "multipart"] }

[dev-dependencies]
wiremock = "0.6"
