[package]
name = "malbox-plugin-internal"
version = "0.1.0"
edition = "2024"

[features]
default = []
host = []
plugin = []

[dependencies]
malbox-plugin-transport = { path = "../malbox-plugin-transport", features = ["ipc", "grpc"] }
malbox-plugin-manifest = { path = "../malbox-plugin-manifest" }

tokio = { workspace = true }
tokio-util = { workspace = true }

dashmap = "6"
notify = "8.2.0"
arc-swap = "1.9.1"
serde.workspace = true
toml.workspace = true
postcard = { version = "1", features = ["alloc"] }
prost = "0.14.3"
tonic = "0.14.6"
tracing.workspace = true

color-eyre.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tonic = "0.14.6"
tokio-stream = { workspace = true }
async-stream = "0.3"
