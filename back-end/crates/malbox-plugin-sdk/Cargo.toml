[package]
name = "malbox-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK for building Malbox analysis plugins"

[features]
host = ["malbox-plugin-transport/ipc", "dep:postcard"]
guest = ["malbox-plugin-transport/grpc", "dep:tonic", "dep:prost", "dep:async-stream", "dep:tokio-stream", "dep:uuid", "dep:globset"]
testkit = []

[dependencies]
malbox-plugin-transport = { path = "../malbox-plugin-transport" }
malbox-plugin-macros = { path = "../malbox-plugin-macros" }

postcard = { version = "1", features = ["alloc"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

tokio = { workspace = true }
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
async-stream = { version = "0.3", optional = true }
tokio-stream = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
globset = { version = "0.4", optional = true }

[dev-dependencies]
malbox-tracing = { path = "../malbox-tracing" }
tempfile = "3.27"
futures = { workspace = true }
