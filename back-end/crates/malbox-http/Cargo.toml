[package]
name = "malbox-http"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
malbox-database = { path = "../malbox-database" }
malbox-utils = { path = "../malbox-utils" }
malbox-config = { path = "../malbox-config" }
malbox-resources = { path = "../malbox-resources" }
malbox-plugin-internal = { path = "../malbox-plugin-internal" }
malbox-plugin-sdk = { path = "../malbox-plugin-sdk" }
malbox-plugin-transport = { path = "../malbox-plugin-transport" }
malbox-scheduler = { path = "../malbox-scheduler" }
malbox-tracing = { path = "../malbox-tracing" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
magic.workspace = true
uuid.workspace = true
axum = { version = "0.8.1", features = ["multipart"] }
axum-macros = "0.5.0"
axum_typed_multipart = "0.16.5"
dotenvy = "0.15.7"
sqlx = { workspace = true }
serde_json = "1.0.116"
toml.workspace = true
tower-http = { version = "0.6.2", features = ["trace"] }
