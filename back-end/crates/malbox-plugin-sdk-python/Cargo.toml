[package]
name = "malbox-plugin-sdk-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the malbox plugin SDK"
publish = false

[lib]
name = "malbox_plugin_sdk"
crate-type = ["cdylib"]

[features]
default = ["host"]
host = ["malbox-plugin-sdk/host", "malbox-plugin-transport/ipc"]

[dependencies]
malbox-plugin-sdk = { path = "../malbox-plugin-sdk", features = ["testkit"] }
malbox-plugin-transport = { path = "../malbox-plugin-transport" }
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.15.0"
